[pytest]
# The tests import top-level modules (rag_core, storage, source_registry,
# eval_harness) that live in the repo root. `python -m pytest` puts the working
# directory on sys.path and bare `pytest` does not, so without this the suite
# passes locally and fails in CI. Setting it here makes both invocations work.
pythonpath = .
testpaths = tests
